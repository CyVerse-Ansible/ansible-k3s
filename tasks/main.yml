---
- name: Gather OS-specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    - "{{ ansible_distribution }}.yml"
    - "{{ ansible_os_family }}.yml"

- name: ASSERT; supported platform
  ansible.builtin.assert:
    that:
      - (ansible_distribution == "Ubuntu" and ansible_distribution_version in ["22.04", "24.04"])
        or (ansible_distribution in ["Rocky", "AlmaLinux"] and ansible_distribution_major_version in ["9", "10"])
    fail_msg: "Unsupported platform {{ ansible_distribution }} {{ ansible_distribution_version }}; see README"

# otherwise, it's set by vars and defaults
- name: SET_FACT; INTERNAL_DOCKER_ENABLE = K3S_DOCKER_ENABLE
  set_fact:
    INTERNAL_DOCKER_ENABLE: "{{ K3S_DOCKER_ENABLE }}"
  when: K3S_DOCKER_ENABLE is defined

- name: SET_FACT; K3s_FLANNEL_BACKEND = K3S_FLANNEL_BACKEND
  set_fact:
    K3s_FLANNEL_BACKEND: "{{ K3S_FLANNEL_BACKEND }}"
  when: K3S_FLANNEL_BACKEND is defined

- name: ASSERT; GPU support requires the embedded containerd runtime
  ansible.builtin.assert:
    that: not (K3S_GPU_ENABLE|bool and INTERNAL_DOCKER_ENABLE|bool)
    fail_msg: "K3S_GPU_ENABLE is not supported with K3S_DOCKER_ENABLE (GPU Operator 26.x is containerd-only)"

# this sets up preliminary settings for multinode k3s
- block:
  - name: SYSCTL; enable forwarding ipv4
    sysctl:
      name: net.ipv4.ip_forward
      value: 1
      state: present

  - name: SYSCTL; enable forwarding ipv6
    sysctl:
      name: net.ipv6.conf.all.forwarding
      value: 1
      state: present

  # - name: SYSCTL; enable net.bridge.bridge-nf-call-iptables
  #   sysctl:
  #     name: net.bridge.bridge-nf-call-iptables
  #     value: 1
  #     state: present

  # - name: SYSCTL; net.bridge.bridge-nf-call-ip6tables
  #   sysctl:
  #     name: net.bridge.bridge-nf-call-ip6tables
  #     value: 1
  #     state: present
  when: K3S_IS_MULTINODE|bool

# host prep for the GPU Operator; the operator itself is installed from k3s-install.yml
# k3s detects nvidia-container-runtime on PATH by itself, so nothing is written for containerd
- name: Block for host NVIDIA container toolkit
  block:
  - name: ANSIBLE.BUILTIN.STAT; look for the host nvidia-container-runtime
    ansible.builtin.stat:
      path: /usr/bin/nvidia-container-runtime
    register: nvidia_runtime_bin

  # with toolkit.enabled=false and cdi.enabled=true the device plugin injects by CDI and
  # expects a spec under /etc/cdi or /var/run/cdi; hosts without the toolkit are skipped
  # (verify on a GPU VM; drop this task if the operator generates the spec anyway)
  - name: ANSIBLE.BUILTIN.COMMAND; generate CDI spec for host-managed toolkit
    ansible.builtin.command: nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
    args:
      creates: /etc/cdi/nvidia.yaml
    when: nvidia_runtime_bin.stat.exists
  when: K3S_GPU_ENABLE|bool and not K3S_NVIDIA_GPU_OPERATOR_TOOLKIT|bool

- name: FILE; create /opt/k3s to be used for install log and passwords, if relevant
  file:
    path: /opt/k3s
    state: directory
    mode: 0755

- import_tasks: postgresql.yml
  when: inventory_hostname in groups['k3s_masters'] and K3S_POSTGRESQL_ENABLE is defined and K3S_POSTGRESQL_ENABLE|bool

- import_tasks: firewall-Ubuntu.yml
  when: ansible_distribution  == "Ubuntu" and K3S_FIREWALL_MANAGE is defined and K3S_FIREWALL_MANAGE|bool

- import_tasks: firewall-Redhat.yml
  when: ansible_distribution in ["AlmaLinux", "Rocky"]

- name: SHELL; uninstall if K3S_FORCE_UNINSTALL; if error, we'll assume it was already uninstalled
  shell: /usr/local/bin/k3s-uninstall.sh
  ignore_errors: true
  when: inventory_hostname in groups['k3s_cluster'] and K3S_FORCE_UNINSTALL is defined and K3S_FORCE_UNINSTALL|bool

# helm is needed for some services
- block:
  - name: SHELL; locate helm binary
    shell:
      cmd: command -v helm
    register: helm_found
    ignore_errors: true
    changed_when: false

  - name: adjust helm path based on env
    set_fact:
      HELM_INSTALL_DIR: "HELM_INSTALL_DIR=/usr/bin"
    when: '"/usr/local/bin" not in ansible_env.PATH'

  - name: SHELL; install helm, if not found
    shell:
      cmd: curl https://raw.githubusercontent.com/helm/helm/HEAD/scripts/get-helm-3 | {{ HELM_INSTALL_DIR | default('') }} bash
    when: helm_found is failed
    ignore_errors: true

  - name: SHELL; locate helm binary once more
    shell:
      cmd: command -v helm
    register: helm_found
    ignore_errors: true
    changed_when: false

  - name: BLOCK; when helm is not found, install from package
    block:
      - name: PACKAGE; install from package if the script fails
        package:
          name: helm
          state: present
        when: ansible_distribution in ["AlmaLinux", "Rocky"]

      - name: SNAP; install from package if the script fails
        community.general.snap:
          name: helm
          state: present
          classic: true
        when: ansible_distribution == "Ubuntu"
    when: helm_found is failed
  when: inventory_hostname in groups['k3s_masters']

- import_tasks: k3s-install.yml
