- name: PACKAGE; install dependencies
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - jq

- name: create the nvidia gpu operator values file
  ansible.builtin.template:
    src: gpu-operator-values.yaml.j2
    dest: /opt/k3s/gpu-operator-values.yaml

- name: HELM_REPOSITORY; add nvidia as https://helm.ngc.nvidia.com/nvidia
  kubernetes.core.helm_repository:
    name: nvidia
    repo_url: https://helm.ngc.nvidia.com/nvidia

- name: SHELL; helm repo update
  shell: helm repo update
  changed_when: false

# Note: upgrading from 25.3.x to 26.x is a major upgrade; read NVIDIA's upgrade doc once
# before running this against an existing cluster.
- name: HELM; install nvidia/gpu-operator
  kubernetes.core.helm:
    name: nvidia-gpu-operator
    chart_ref: nvidia/gpu-operator
    release_namespace: gpu-operator
    chart_version: "{{ K3S_NVIDIA_GPU_OPERATOR_CHART_VERSION }}"
    create_namespace: true
    values_files:
      - /opt/k3s/gpu-operator-values.yaml
    wait: true
    timeout: 10m
